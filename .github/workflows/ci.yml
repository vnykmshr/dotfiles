name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6

    - name: Install tools (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update -q
        sudo apt-get install -y shellcheck zsh jq

    - name: Ensure scripts are executable
      run: |
        chmod +x tests/test-all.sh tests/test-critical-path.sh
        chmod +x tests/test-functionality.sh tests/test-templates.sh tests/lint.sh
        chmod +x install/setup.sh

    - name: Run tests
      run: ./tests/test-all.sh

    - name: Run linting
      run: ./tests/lint.sh

    - name: Run shellcheck
      run: |
        find . -name "*.sh" -not -path "./.git/*" -print0 | \
          xargs -0 shellcheck --severity=warning
        for f in bin/*; do
          [ -f "$f" ] && head -1 "$f" | grep -q bash && \
            shellcheck --severity=warning "$f"
        done

    - name: Test dry-run install
      run: DRY_RUN=true ./install/setup.sh

  security:
    # Shared workflow: https://github.com/1mb-dev/.github/blob/main/.github/workflows/secret-scan.yml
    uses: 1mb-dev/.github/.github/workflows/secret-scan.yml@decd3ad8b42c0f5c20f2017571ca8061521637bb

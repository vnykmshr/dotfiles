name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7

    - name: Install tools (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update -q
        sudo apt-get install -y zsh jq

    - name: Run tests
      run: ./tests/test-all.sh

    - name: Test dry-run install
      run: DRY_RUN=true ./install/setup.sh

  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install pre-commit
      run: pipx install pre-commit

    - name: Run hooks
      run: pre-commit run --all-files --show-diff-on-failure

  security:
    # Shared workflow: https://github.com/1mb-dev/.github/blob/main/.github/workflows/secret-scan.yml
    uses: 1mb-dev/.github/.github/workflows/secret-scan.yml@decd3ad8b42c0f5c20f2017571ca8061521637bb
